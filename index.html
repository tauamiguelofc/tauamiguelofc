
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tauã Miguel | ARVEXA Technologies</title>
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* Animated Background Particles */
        .bg-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #030712 100%);
        }

        .orb {
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--accent-glow);
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
            animation: float-orb 20s infinite alternate;
        }

        @keyframes float-orb {
            from { transform: translate(-20%, -20%); }
            to { transform: translate(20%, 20%); }
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 40px 20px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px) rotateX(-10deg); }
            to { opacity: 1; transform: translateY(0) rotateX(0); }
        }

        .profile-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            padding: 5px;
            background: var(--bg);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .profile-img:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: -0.025em;
            margin-bottom: 8px;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bio {
            font-size: 0.95rem;
            color: var(--text-dim);
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .section-title {
            text-align: left;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin: 25px 0 12px 5px;
            font-weight: 800;
        }

        .links-grid {
            display: grid;
            gap: 12px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .link-card:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--accent);
            transform: translateX(5px);
        }

        .link-card::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: 0.5s;
        }

        .link-card:hover::after {
            left: 100%;
        }

        .badge {
            font-size: 0.7rem;
            background: var(--accent);
            color: var(--bg);
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 700;
        }

        .social-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .social-icon {
            color: var(--text-dim);
            text-decoration: none;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .social-icon:hover {
            color: var(--accent);
            transform: translateY(-3px);
        }

        .footer {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #475569;
        }

        /* Interactive JS hover effect will be added via script */
    </style>
</head>
<body>

    <div class="bg-glow">
        <div class="orb"></div>
    </div>

    <div class="container" id="main-card">
        <div class="profile-wrapper">
            <!-- Substitua pelo link da sua foto no GitHub -->
            <img src="tauaofc.png" alt="Tauã Miguel" class="profile-img">
        </div>
        
        <h1>Tauã Miguel</h1>
        <p class="bio">
            19 anos | Graduando em Eng. Química (UFAL)<br>
            Software Developer & Security Researcher
        </p>

        <div class="section-title">🏢 ARVEXA TECHNOLOGIES</div>
        <div class="links-grid">
            <a href="https://instagram.com/arvexa" class="link-card" target="_blank">
                <span>Instagram Arvexa</span>
                <span class="badge">Oficial</span>
            </a>
            <a href="#" class="link-card" target="_blank">
                <span>Thermo Lab</span>
                <span class="badge">Ativo</span>
            </a>
        </div>

        <div class="section-title">🚀 PROJETOS PESSOAIS</div>
        <div class="links-grid">
            <a href="#" class="link-card" target="_blank">
                <span>Kora</span>
                <span class="badge">Private</span>
            </a>
        </div>

        <div class="section-title">🌐 CONTATO & REDES</div>
        <div class="social-row">
            <a href="https://github.com/taua-ofc" class="social-icon" target="_blank">GitHub</a>
            <a href="https://instagram.com/taua.ofc" class="social-icon" target="_blank">Instagram</a>
            <a href="mailto:contato@arvexa.tech" class="social-icon">Email</a>
        </div>

        <div class="footer">
            &copy; 2026 AEGIS Dynamics / ARVEXA
        </div>
    </div>

    <script>
        const card = document.getElementById('main-card');
        
        // 3D Tilt Effect
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Reset on leave
        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
            card.style.transition = 'all 0.5s ease';
        });

        document.addEventListener('mouseenter', () => {
            card.style.transition = 'none';
        });

        // Console Easter Egg
        console.log("%cARVEXA Technologies %c- System Ready", "color: #38bdf8; font-weight: bold; font-size: 14px;", "color: #94a3b8;");
    </script>
</body>
  </html>
