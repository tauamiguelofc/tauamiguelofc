<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tauã Miguel - Software Developer na AEGIS-Dynamics">
    <title>Tauã Miguel | Vanguard Hub</title>
    
    <!-- Fontes Modernas -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Palette: Black, Red, White */
            --bg-dark: #000000;
            --bg-gradient: linear-gradient(-45deg, #000000, #1a0000, #4d0000, #000000);
            --card-bg: rgba(10, 10, 10, 0.9);
            --text-main: #ffffff;
            --text-dim: #a1a1aa;
            --primary: #ff0000;
            --primary-hover: #cc0000;
            --white: #ffffff;
            --border: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --bg-dark: #f4f4f5;
            --bg-gradient: linear-gradient(-45deg, #ffffff, #fecaca, #f87171, #ffffff);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #09090b;
            --text-dim: #52525b;
            --primary: #dc2626;
            --primary-hover: #991b1b;
            --white: #000000;
            --border: rgba(0, 0, 0, 0.1);
        }

        /* Animação de Fundo estilo GIF */
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientFlow 15s ease infinite;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            transition: all 0.5s ease;
        }

        /* Container Principal */
        .hub-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-top: 5px solid var(--primary);
            border-radius: 20px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        /* Foto e Status */
        .profile-container { margin-bottom: 20px; position: relative; }
        
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 15px;
            border: 2px solid var(--primary);
            padding: 3px;
            object-fit: cover;
        }

        .status-tag {
            background: var(--primary);
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 5px;
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            text-transform: uppercase;
        }

        h1 { font-size: 1.6rem; font-weight: 800; margin-top: 15px; text-transform: uppercase; letter-spacing: -0.5px; }
        .bio { font-size: 0.85rem; color: var(--text-dim); line-height: 1.5; margin: 10px 0 30px; }
        .highlight { color: var(--primary); font-weight: 700; }

        /* SEÇÃO SPLIT: KORA & THERMO LAB */
        .split-container {
            display: flex;
            height: 70px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }

        .split-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .split-left {
            background: var(--primary);
            color: white;
            clip-path: polygon(0 0, 100% 0, 80% 100%, 0% 100%);
            padding-right: 15px;
        }

        .split-right {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            margin-left: -20px;
            clip-path: polygon(20% 0, 100% 0, 100% 100%, 0% 100%);
            padding-left: 15px;
        }

        .split-item:hover { opacity: 0.8; transform: scale(1.02); }
        .split-title { font-weight: 800; font-size: 0.75rem; text-transform: uppercase; }
        .split-sub { font-family: 'JetBrains Mono', monospace; font-size: 9px; opacity: 0.7; }

        /* Botões Padrão */
        .action-link {
            background: transparent;
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 12px;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .action-link:hover {
            border-color: var(--primary);
            background: rgba(255, 0, 0, 0.05);
            padding-left: 20px;
        }

        /* Footer */
        .footer-socials {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .social-btn {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-dim);
            text-decoration: none;
            text-transform: uppercase;
        }

        .social-btn:hover { color: var(--primary); }

        .theme-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 45px;
            height: 45px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .aad-brand {
            margin-top: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 8px;
            letter-spacing: 3px;
            opacity: 0.4;
            text-transform: uppercase;
        }
    </style>
</head>
<body data-theme="dark">

    <button class="theme-switch" onclick="toggleTheme()" id="tBtn">🌙</button>

    <main class="hub-card">
        
        <header class="profile-container">
            <img src="tauaofc.png" alt="Tauã Miguel" class="profile-img">
            <div class="status-tag">System ID: 019-AAD</div>
        </header>

        <h1>Tauã Miguel</h1>
        <p class="bio">
            Desenvolvedor na <span class="highlight">AEGIS-Dynamics</span><br>
            Engenharia Química • <span class="highlight">UFAL</span>
        </p>

        <!-- Seção Dividida: Projetos -->
        <div class="split-container">
            <a href="https://kora-one-chi.vercel.app/" class="split-item split-left" target="_blank">
                <span class="split-title">Projeto Kora</span>
                <span class="split-sub">Infrastructure</span>
            </a>
            <a href="https://github.com/AAD-Systems/thermolab" class="split-item split-right" target="_blank">
                <span class="split-title">Thermo Lab</span>
                <span class="split-sub">v0.2.1-Alpha</span>
            </a>
        </div>

        <nav>
            <a href="https://www.instagram.com/arvexa.technology?igsh=OGV4eDYzNTh3am9s" class="action-link" target="_blank">
                <span>Arvexa Technologies</span>
                <span style="color:var(--primary)">⚡</span>
            </a>
            
            <a href="https://github.com/tauamiguelofc" class="action-link" target="_blank">
                <span>Repositório Principal</span>
                <span style="opacity:0.5">/git</span>
            </a>

            <a href="mailto:arvexatechnologys@gmail.com" class="action-link">
                <span>Contato Direto</span>
                <span style="opacity:0.5">@</span>
            </a>
        </nav>

        <footer class="footer-socials">
            <a href="https://instagram.com/taua.ofc" class="social-btn" target="_blank">Instagram</a>
            <a href="https://github.com/tauamiguelofc" class="social-btn" target="_blank">GitHub</a>
        </footer>

        <div class="aad-brand">Aegis Dynamics // Operations Division</div>

    </main>

    <script>
        function toggleTheme() {
            const b = document.body;
            const t = document.getElementById('tBtn');
            const isD = b.getAttribute('data-theme') === 'dark';
            b.setAttribute('data-theme', isD ? 'light' : 'dark');
            t.innerHTML = isD ? '☀️' : '🌙';
        }
    </script>
</body>
</html>
